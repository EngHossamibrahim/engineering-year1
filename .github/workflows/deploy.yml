name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare site
        run: |
          mkdir -p site
          f=$(for x in *index.html; do echo "$(git log -1 --format=%ct -- "$x") $x"; done | sort -n | tail -n1 | cut -d" " -f2)
          echo "using $f"
          h=$(sha256sum "$f" | cut -c1-12)
          cp "$f" "site/app-$h.html"
          echo "{\"file\":\"app-$h.html\"}" > site/version.json
          cat > site/index.html <<'LOADER'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="Pragma" content="no-cache">
          <meta http-equiv="Expires" content="0">
          <title>Freshman 26</title>
          <style>html,body{margin:0;background:#14161a;color:#fff;font-family:sans-serif}#m{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.7}</style>
          </head>
          <body>
          <div id="m">...</div>
          <script>
          (function () {
            var base = location.pathname.replace(/[^\/]*$/, '');
            function fail() { document.getElementById('m').innerHTML = '<a style="color:#fff" href="' + location.pathname + '?r=' + Date.now() + location.hash + '">Reload</a>'; }
            fetch(base + 'version.json?t=' + Date.now(), { cache: 'no-store' })
              .then(function (r) { if (!r.ok) throw 0; return r.json(); })
              .then(function (v) { return fetch(base + v.file); })
              .then(function (r) { if (!r.ok) throw 0; return r.text(); })
              .then(function (html) { document.open(); document.write(html); document.close(); })
              .catch(fail);
          })();
          </script>
          </body>
          </html>
          LOADER
          touch site/.nojekyll
          if [ -f lab-preview/1-p6-index.html ]; then mkdir -p site/lab-preview && cp lab-preview/1-p6-index.html site/lab-preview/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
